# Platinum AIT dashboard: one app container and its own small Postgres.
# Lives in /opt/ait. Nothing here touches other sites, Twenty or n8n.
name: ait

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ait
      POSTGRES_USER: ait
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 128mb
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ait -d ait"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    image: platinum-ait:${AIT_TAG:?set AIT_TAG to the git commit being deployed}
    build: { context: .., target: runtime }
    restart: unless-stopped
    env_file: ./app.env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./documents:/data/documents
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    networks:
      internal: {}
      proxy: { aliases: [ait-app] }
      education: {}
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  tools:
    image: platinum-ait-tools:${AIT_TAG:?set AIT_TAG}
    build: { context: .., target: tools }
    profiles: [tools]
    env_file: ./app.env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./documents:/data/documents
    networks: [internal]
    mem_limit: 768m

secrets:
  db_password:
    file: ./secrets/db_password

networks:
  internal: {}
  # The EasyEngine site network for ait.getstrategic.vip, so its nginx can reach the app as "ait-app".
  proxy:
    external: true
    name: ${AIT_PROXY_NETWORK:?set AIT_PROXY_NETWORK to the ait.getstrategic.vip site network}
  # The study site's network, so the app can call its internal account-provisioning endpoint.
  education:
    external: true
    name: ${AIT_EDUCATION_NETWORK:-insurance.getstrategic.vip}
