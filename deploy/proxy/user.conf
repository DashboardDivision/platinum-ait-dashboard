# /opt/easyengine/sites/ait.getstrategic.vip/config/nginx/custom/user.conf
# The site was created with `ee site create ait.getstrategic.vip --ssl=le` (html type).
# This file only affects ait.getstrategic.vip. Mirror whatever the crm.getstrategic.vip site
# does if its proxy pattern differs; do not edit any other site's config.

client_max_body_size 16m;

location / {
    proxy_pass http://ait-app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}
